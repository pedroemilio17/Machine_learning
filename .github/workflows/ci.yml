name: Verificação ML
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --test tests/test_predict_core.cjs
      - run: python -m compileall -q flux-lab/export_model.py scripts/verify_parity.py
      - name: Checar presença do artefato de inferência
        run: |
          if test -f flux-lab/model.json.gz; then
            node tests/verify_web_model.cjs
          else
            echo "::warning::model.json.gz ausente; exporte o modelo para habilitar o simulador"
          fi
